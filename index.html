<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn("Muriell: Could not make window.fetch writable.", e);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MURIELL - Discipline is Freedom</title>
    <!-- Updated favicon eyes to be lower (y=48) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 25 55 C 25 25, 75 25, 75 55 L 75 90 L 64 82 L 64 90 L 50 82 L 50 90 L 36 82 L 36 85 L 25 80 Z' fill='%23EF216A'/%3E%3Cpath d='M 32 48 C 32 54, 43 54, 43 48' stroke='white' stroke-width='4' fill='none'/%3E%3Cpath d='M 57 48 C 57 54, 68 54, 68 48' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="loader">
      <svg class="loader-ghost" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 25 55 C 25 25, 75 25, 75 55 L 75 90 L 64 82 L 64 90 L 50 82 L 50 90 L 36 82 L 36 85 L 25 80 Z" fill="#EF216A"/>
        <!-- Updated eyes for lower position -->
        <path d="M 32 48 C 32 54, 43 54, 43 48" stroke="white" stroke-width="4" stroke-linecap="round"/>
        <path d="M 57 48 C 57 54, 68 54, 68 48" stroke="white" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="loader-bar-container">
        <div class="loader-bar"></div>
      </div>
      <div class="loader-text">Initializing Muriell Protocol</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        setTimeout(() => {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 800);
        }, 1200);
      });
    </script>
  </body>
</html>
